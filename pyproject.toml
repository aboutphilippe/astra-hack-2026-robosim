[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nono-chess"
version = "0.1.0"
description = "SO-101 chess: calibrated observations, MuJoCo motion previews, and a React control room"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "numpy>=1.26,<3",
  "mujoco>=3.3,<4", "python-chess>=1.999,<2", "pydantic>=2.10,<3",
  "httpx>=0.28,<1", "mcp>=1.12,<2", "pillow>=11,<13",
]

[project.optional-dependencies]
camera = ["opencv-python>=4.11,<5", "pyorbbecsdk2>=2.1", "pyobjc-framework-AVFoundation>=11; sys_platform == 'darwin'"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
nono-api = "chessbot.api:main"
nono-mcp = "chessbot.mcp_server:main"
nono-discover = "chessbot.hardware:main"
nono-server = "chessbot.team_server:main"
nono-team = "chessbot.team_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/chessbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
